name: Build ChamaJa APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'chamaja-android/**'
      - '.github/workflows/chamaja-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android API 36
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Lint Android
        run: gradle -p chamaja-android lintDebug --no-daemon --stacktrace

      - name: Build installable APK
        run: gradle -p chamaja-android assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -f chamaja-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChamaJa-Android-APK
          path: chamaja-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
