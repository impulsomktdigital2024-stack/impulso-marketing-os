plugins {
    id 'com.android.application'
}

def envString = { String name ->
    (System.getenv(name) ?: '').replace('\\', '\\\\').replace('"', '\\"')
}

android {
    namespace 'com.chamaja.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chamaja.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1.0'

        buildConfigField 'String', 'FIREBASE_PROJECT_ID', "\"${envString('CHAMAJA_FIREBASE_PROJECT_ID')}\""
        buildConfigField 'String', 'FIREBASE_APP_ID', "\"${envString('CHAMAJA_FIREBASE_APP_ID')}\""
        buildConfigField 'String', 'FIREBASE_API_KEY', "\"${envString('CHAMAJA_FIREBASE_API_KEY')}\""
        buildConfigField 'String', 'FIREBASE_SENDER_ID', "\"${envString('CHAMAJA_FIREBASE_SENDER_ID')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'
}
